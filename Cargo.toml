[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
qcc-domain = { path = "crates/qcc-domain" }
qcc-runtime = { path = "crates/qcc-runtime" }
qcc-store = { path = "crates/qcc-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
