# Builds the desktop app for a release. It is not triggered on its own: the
# release workflow (generated by dist, see dist-workspace.toml) calls it once dist
# has built `qcc` and `qccd`, and publishes whatever it uploads as
# `artifacts-*` in the same GitHub Release.
#
# The bundles carry `qccd` and `qcc` as Tauri sidecars, taken from the archives
# dist built for the same target, so the app works without a separate install.
# Nothing is signed or notarized.
name: Desktop

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc, the same as the dist builds.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # The same pinned Apple silicon image as the dist builds in dist-workspace.toml.
          - runner: macos-26
            target: aarch64-apple-darwin
          # Cross-compiled on Apple silicon.
          - runner: macos-26
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the system libraries of Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install the Rust target
        run: rustup target add "$TARGET"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install the frontend dependencies and the Tauri CLI
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          npm install --global @tauri-apps/cli@2

      - name: Fetch the binaries dist built
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: dist-artifacts
          merge-multiple: true

      - name: Put qccd and qcc in place as sidecars
        shell: bash
        run: |
          set -euo pipefail
          binaries=apps/desktop/src-tauri/binaries
          mkdir -p "$binaries" unpacked
          for archive in qcc-daemon qcc-cli; do
            tar -xJf "dist-artifacts/$archive-$TARGET.tar.xz" -C unpacked
          done
          # Tauri looks for a sidecar named after the target triple.
          install -m 755 "unpacked/qcc-daemon-$TARGET/qccd" "$binaries/qccd-$TARGET"
          install -m 755 "unpacked/qcc-cli-$TARGET/qcc" "$binaries/qcc-$TARGET"
          ls -l "$binaries"

      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          mkdir -p desktop-artifacts
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} desktop-artifacts/ \;
          ls -l desktop-artifacts
          test -n "$(ls desktop-artifacts)"

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-desktop-${{ matrix.target }}
          path: desktop-artifacts/*
          if-no-files-found: error
