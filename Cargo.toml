[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
qcc-domain = { path = "crates/qcc-domain" }
qcc-runtime = { path = "crates/qcc-runtime" }
qcc-store = { path = "crates/qcc-store" }
qcc-plugin-sdk = { path = "crates/qcc-plugin-sdk" }
qcc-plugin-host = { path = "crates/qcc-plugin-host" }
qcc-plugins-bundle = { path = "crates/qcc-plugins-bundle" }
qcc-plugin-testkit = { path = "crates/qcc-plugin-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wit-bindgen = "0.63"
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
tokio = { version = "1", features = ["sync"] }
toml = "1"
tracing = "0.1"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
