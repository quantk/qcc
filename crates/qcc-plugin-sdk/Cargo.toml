[package]
name = "qcc-plugin-sdk"
description = "Guest side of the qcc plugin contract: traits with defaults and the export macro"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# JSON-RPC helpers for bridges whose agent speaks it.
jsonrpc = ["dep:serde_json"]
# Builders for the UI nodes a plugin draws its views from.
ui = ["dep:serde_json"]

[dependencies]
wit-bindgen.workspace = true
serde_json = { workspace = true, optional = true }

# Generated component glue needs `unsafe`, which the workspace lints forbid.
[lints]
