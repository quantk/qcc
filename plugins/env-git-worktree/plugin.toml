id = "env-git-worktree"
name = "Git worktree"
description = "Gives a thread a git worktree of its own, so agents do not step on each other's files."
version = "0.1.0"
api = "0.2"
wasm = "plugin.wasm"

[permissions]
kv = true
timers = true
# git does the work; bash runs the repository's own setup and teardown scripts and
# copies the files `.worktreeinclude` names; rmdir removes the emptied directory.
process = ["git", "bash", "rmdir"]
