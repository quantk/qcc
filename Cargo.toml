[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "apps/desktop/src-tauri"]
# The desktop app needs GUI libraries that only the `.#desktop` shell provides.
default-members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/quantk/qcc"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
qcc-domain = { path = "crates/qcc-domain" }
qcc-runtime = { path = "crates/qcc-runtime" }
qcc-store = { path = "crates/qcc-store" }
qcc-plugin-sdk = { path = "crates/qcc-plugin-sdk" }
qcc-plugin-testkit = { path = "crates/qcc-plugin-testkit" }
qcc-plugin-host = { path = "crates/qcc-plugin-host" }
qcc-plugins-bundle = { path = "crates/qcc-plugins-bundle" }
qcc-protocol = { path = "crates/qcc-protocol" }
qcc-client = { path = "crates/qcc-client" }
qcc-daemon = { path = "crates/qcc-daemon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wit-bindgen = "0.63"
wasmtime = { version = "50", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation", "cache"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
tokio = { version = "1", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v7"] }
base64 = "0.22"
jiff = "0.2"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.15"
specta-serde = "=0.0.15"
specta-util = "=0.0.15"

# The profile `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
