<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Echo canvas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Echo canvas</h1>

    <script src="app.js"></script>
  </body>
</html>
